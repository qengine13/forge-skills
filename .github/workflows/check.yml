name: Package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_package.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/memory_demo.py
      - run: python -m ruff check scripts tests skills/crucible-forge/scripts skills/agent-memory/scripts/run.py
      - run: python -m ruff format --check scripts tests skills/crucible-forge/scripts skills/agent-memory/scripts/run.py
